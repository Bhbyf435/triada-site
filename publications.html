<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Публикации — ТРИАДА</title><link rel="stylesheet" href="assets/css/styles.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/api.js"></script><script defer src="assets/js/common.js"></script></head><body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">ТРИАДА<span>▲</span></a><nav class="nav" data-nav><a href="challenges.html">Решаем задачи</a><a href="projects.html">Технологии и проекты</a><a href="creators.html">Создатели технологий</a><a href="publications.html">Публикации</a><a href="cooperation.html">Сотрудничество</a><a href="about.html">О Фонде</a></nav><button class="nav-toggle" data-nav-toggle>☰</button></div></header>
<main><section class="page-hero"><div class="container"><div class="eyebrow">Наука · Технологии · Люди · Аналитика</div><h1>Публикации</h1><p>Наука, технологии и реальные задачи промышленности — понятным языком, без превращения научного содержания в рекламный лозунг.</p></div></section><section><div class="container"><input class="search" id="search" placeholder="Найти тему, технологию, автора..."><div class="grid grid-3" id="grid"><div class="empty">Загрузка...</div></div><article id="article" class="detail-content"></article></div></section></main><footer class="footer"><div class="container"><div class="brand">ТРИАДА<span>▲</span></div></div></footer>
<script>window.addEventListener('DOMContentLoaded',async()=>{const grid=document.querySelector('#grid'),article=document.querySelector('#article'),q=document.querySelector('#search'),id=TriadaUI.qs('id');try{const b=await TriadaAPI.get('bootstrap');const all=b.publications||[];function render(){const t=q.value.trim().toLowerCase();const rows=all.filter(p=>!t||[p.title,p.lead,p.type,p.author].join(' ').toLowerCase().includes(t));grid.innerHTML=rows.length?rows.map(TriadaUI.publicationCard).join(''):'<div class="empty">Материалы не найдены.</div>'}q.oninput=render;render();if(id){const p=all.find(x=>x.id===id);if(p){article.innerHTML=`<h2>${TriadaUI.esc(p.title)}</h2><p class="eyebrow">${TriadaUI.esc(p.type)} · ${TriadaUI.esc(p.author)}</p><p>${TriadaUI.esc(p.lead)}</p>${/^https?:/.test(p.content)?`<p><a class="button secondary" href="${TriadaUI.esc(p.content)}" target="_blank" rel="noopener">Открыть материал</a></p>`:`<p>${TriadaUI.esc(p.content)}</p>`}`;article.scrollIntoView({behavior:'smooth'})}}}catch(e){grid.innerHTML=`<div class="empty">${TriadaUI.esc(e.message)}</div>`}});</script>
</body></html>
