<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Создатель технологии — ТРИАДА</title><link rel="stylesheet" href="assets/css/styles.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/api.js"></script><script defer src="assets/js/common.js"></script></head><body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">ТРИАДА<span>▲</span></a><nav class="nav" data-nav><a href="projects.html">Технологии и проекты</a><a href="creators.html">Создатели технологий</a><a href="cooperation.html">Сотрудничество</a></nav><button class="nav-toggle" data-nav-toggle>☰</button></div></header><main id="content"><section class="page-hero"><div class="container"><div class="empty">Загрузка...</div></div></section></main><footer class="footer"><div class="container"><div class="brand">ТРИАДА<span>▲</span></div></div></footer>
<script>window.addEventListener('DOMContentLoaded',async()=>{const id=TriadaUI.qs('id'),root=document.querySelector('#content');try{const [r,b]=await Promise.all([TriadaAPI.get('creator',{id}),TriadaAPI.get('bootstrap')]);if(!r.ok)throw new Error(r.error||'Профиль не найден');const c=r.creator;const projects=(b.projects||[]).filter(p=>(c.projectIds||[]).includes(p.id));document.title=c.name+' — ТРИАДА';root.innerHTML=`<section class="page-hero"><div class="container"><div class="eyebrow">${TriadaUI.esc((c.roles||[]).join(' · '))}</div><h1>${TriadaUI.esc(c.name)}</h1><p>${TriadaUI.esc([c.degree,c.title].filter(Boolean).join(' · '))}</p></div></section><section><div class="container detail-grid"><article class="detail-content">${c.photo?`<img class="portrait" style="max-width:520px" src="${TriadaUI.esc(c.photo)}" alt="${TriadaUI.esc(c.name)}">`:''}<h2>О специалисте</h2><p>${TriadaUI.esc(c.bio||'Публичная биография готовится.')}</p>${c.quote?`<h2>Авторская цитата</h2><p>«${TriadaUI.esc(c.quote)}»</p>`:''}<h2>Какие задачи может помогать решать</h2><p>${TriadaUI.esc(c.tasks||'Информация уточняется.')}</p><h2>Разработки и проекты</h2><div class="grid grid-2">${projects.length?projects.map(TriadaUI.projectCard).join(''):'<div class="empty">Связанные публичные проекты пока не опубликованы.</div>'}</div>${c.patents?`<h2>Патенты и интеллектуальная собственность</h2><p>${TriadaUI.esc(c.patents)}</p>`:''}</article><aside class="detail-sidebar card"><div class="fact"><span>Роль</span><b>${TriadaUI.esc((c.roles||[]).join(' · '))}</b></div><div class="fact"><span>Компетенции</span><b>${TriadaUI.esc((c.competences||[]).join(' · '))}</b></div><a class="button" href="cooperation.html?form=creator&creator=${encodeURIComponent(c.id)}">Связаться через ТРИАДУ</a></aside></div></section>`}catch(e){root.innerHTML=`<section class="page-hero"><div class="container"><div class="empty">${TriadaUI.esc(e.message)}</div></div></section>`}});</script>
</body></html>
