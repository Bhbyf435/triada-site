<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Проект — ТРИАДА</title><link rel="stylesheet" href="assets/css/styles.css"><script defer src="assets/js/config.js"></script><script defer src="assets/js/api.js"></script><script defer src="assets/js/common.js"></script></head><body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">ТРИАДА<span>▲</span></a><nav class="nav" data-nav><a href="challenges.html">Решаем задачи</a><a href="projects.html">Технологии и проекты</a><a href="creators.html">Создатели технологий</a><a href="cooperation.html">Сотрудничество</a></nav><button class="nav-toggle" data-nav-toggle>☰</button></div></header>
<main id="content"><section class="page-hero"><div class="container"><div class="empty">Загрузка проекта...</div></div></section></main>
<footer class="footer"><div class="container"><div class="brand">ТРИАДА<span>▲</span></div><p class="legal">Наличие проекта в портфеле ТРИАДЫ само по себе не является подтверждением всех заявленных разработчиком характеристик.</p></div></footer>
<script>window.addEventListener('DOMContentLoaded',async()=>{const id=TriadaUI.qs('id');const root=document.querySelector('#content');try{const r=await TriadaAPI.get('project',{id});if(!r.ok)throw new Error(r.error||'Проект не найден');const p=r.project;document.title=p.name+' — ТРИАДА';const level=Math.max(0,Math.min(7,Number(String(p.evidenceLevel||'D0').replace('D',''))||0));root.innerHTML=`<section class="page-hero"><div class="container"><div class="eyebrow">${TriadaUI.esc(p.direction)} · ${TriadaUI.esc(TriadaUI.stageLabel(p.stage))}</div><h1>${TriadaUI.esc(p.name)}</h1><p>${TriadaUI.esc(p.lead||'')}</p></div></section><section><div class="container detail-grid"><article class="detail-content"><h2>Какую задачу решает проект</h2><p>${TriadaUI.esc(p.problem||'Информация готовится.')}</p><h2>Что предлагает команда</h2><p>${TriadaUI.esc(p.solution||'Информация готовится.')}</p><h2>Как это работает</h2><p>${TriadaUI.esc(p.howItWorks||'Публичное описание технологического принципа готовится.')}</p><h2>Где применяется</h2><p>${TriadaUI.esc(p.applications||'')}</p><h2>Возможный эффект</h2><p>${TriadaUI.esc(p.effect||'')}</p><h2>Что подтверждено</h2><p>${TriadaUI.esc(p.confirmed||'Доказательная база уточняется.')}</p><div class="evidence-scale">${[0,1,2,3,4,5,6].map(i=>`<span class="${i<level?'on':''}"></span>`).join('')}</div><h2>Следующий шаг проекта</h2><p>${TriadaUI.esc(p.need||'Определяется совместно с командой.')}</p>${p.materialsLink?`<p><a class="text-link" href="${TriadaUI.esc(p.materialsLink)}" target="_blank" rel="noopener">Публичные материалы проекта →</a></p>`:''}</article><aside class="detail-sidebar card"><div class="fact"><span>Стадия</span><b>${TriadaUI.esc(TriadaUI.stageLabel(p.stage))}</b></div><div class="fact"><span>Доказательность</span><b>${TriadaUI.esc(p.evidenceLevel)}</b></div><div class="fact"><span>Роль ТРИАДЫ</span><b>${TriadaUI.esc(p.triadaRole||'Уточняется')}</b></div><div class="fact"><span>Требуется</span><b>${TriadaUI.esc(p.need||'Уточняется')}</b></div><div class="fact"><span>Регион / рынки</span><b>${TriadaUI.esc([p.region,p.markets].filter(Boolean).join(' · '))}</b></div><a class="button" href="cooperation.html?form=project&project=${encodeURIComponent(p.id)}">Обсудить проект с ТРИАДОЙ</a></aside></div></section>`}catch(e){root.innerHTML=`<section class="page-hero"><div class="container"><div class="empty">${TriadaUI.esc(e.message)}</div></div></section>`}});</script>
</body></html>
